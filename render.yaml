# Render blueprint for the Quotely API — free tier, zero monthly cost.
#
# What this file is: the shape of the service. What it deliberately is NOT: a place for secrets.
# Every sensitive value is declared with `sync: false`, which tells Render to ask for it in the
# dashboard instead of reading it from this repository. Nothing here can be committed by accident
# because there is nothing here to commit.
#
# Read docs/hosting.md before deploying — the free tier sleeps after inactivity, and the database
# has to exist before the first request arrives.

services:
  - type: web
    name: quotely-api
    runtime: docker
    plan: free
    region: singapore          # closest free region to the Supabase project in ap-south-1
    branch: main               # PROD follows main; TEST is a separate service on develop
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ---- database ----
      # Supabase's SESSION POOLER string (port 5432, host aws-<index>-<region>.pooler.supabase.com,
      # user postgres.<project-ref>). Not the direct connection — that is IPv6-only without a paid
      # add-on and Render's free tier has no IPv6 outbound. Not the transaction pooler on 6543
      # either: that is for per-request serverless connections, not a long-running process with a
      # connection pool. Must include SSL Mode=Require.
      - key: ConnectionStrings__DefaultConnection
        sync: false

      # ---- authentication ----
      # 32+ characters of randomness. Changing it signs every user out, which is the intended
      # behaviour if it is ever believed to have leaked.
      - key: JWT__KEY
        sync: false
      - key: JWT__ISSUER
        value: Quotely
      - key: JWT__AUDIENCE
        value: QuotelyWeb

      # ---- merchant credential encryption ----
      # Protects the Razorpay credentials each business entrusts to us, at rest. 32 random bytes,
      # base64: `openssl rand -base64 32`. Production refuses to start without it, because a
      # deployment that cannot encrypt a merchant's key secret must not be storing one.
      #
      # Rotating it: move the current value to Encryption__PreviousKeys__0 and set a new
      # Encryption__Key. Existing rows still decrypt — each ciphertext names the key that wrote it.
      - key: Encryption__Key
        sync: false

      # ---- QUOTELY'S OWN Razorpay account ----
      # These collect the ₹150/month SaaS subscription from businesses using Quotely. They are NOT
      # used to collect invoice payments: that money belongs to the business and is collected with
      # the business's own credentials, from MerchantPaymentConnection. See docs/razorpay-partner.md.
      #
      # Mode is explicit rather than inferred from the key prefix. Production refuses to start when
      # the two disagree, in either direction — a live key in a test deployment is refused just as
      # firmly as a test key in a live one.
      - key: Razorpay__Mode
        value: Test
      - key: Razorpay__KeyId
        sync: false
      - key: Razorpay__KeySecret
        sync: false
      # Signs Quotely's SUBSCRIPTION webhooks, delivered to /api/webhooks/razorpay/billing.
      # Merchant payment webhooks do not use this: each business's connection has its own secret.
      - key: Razorpay__WebhookSecret
        sync: false

      # ---- Razorpay Technology Partner OAuth (not yet available) ----
      # Empty until Razorpay approves the partner application. While empty, "Connect with Razorpay"
      # is reported unavailable and businesses connect with their own API keys instead — nothing is
      # stubbed. See docs/razorpay-partner.md for the exact onboarding steps.
      - key: Razorpay__Oauth__ClientId
        sync: false
      - key: Razorpay__Oauth__ClientSecret
        sync: false
      - key: Razorpay__Oauth__RedirectUri
        sync: false

      # ---- Quotely's own subscription billing ----
      # Off by default. A deployment that has not decided to charge anybody creates no mandates and
      # locks nobody out. Enforcement is a second, separate switch, so billing can be introduced
      # before the day an expired account first loses the ability to create an invoice.
      - key: Billing__Enabled
        value: "false"
      - key: Billing__EnforceEntitlements
        value: "false"

      # ---- internal overview ----
      # Email addresses allowed to read /api/admin/billing/accounts. Empty means nobody.
      - key: Admin__Emails__0
        sync: false

      # ---- the customer-facing site ----
      # Origin of the Cloudflare Pages deployment (https://<project>.pages.dev). Public quotation
      # and invoice URLs are built from it — /q/{token} and /i/{token} are frontend routes — so
      # pointing this at the API instead produces links that resolve to nothing.
      - key: PublicLinks__BaseUrl
        sync: false
      # Explicit allow-list — the same Cloudflare Pages origin. Never a wildcard: these are the only
      # origins a browser may call the API from. Configuration binds Cors__AllowedOrigins__0, __1, …
      # as an array.
      - key: Cors__AllowedOrigins__0
        sync: false
